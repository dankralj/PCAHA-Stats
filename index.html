<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<title>Hockey Game Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---------- theme: dark rink by default ---------- */
:root{
  --bg:#0a0f16; --surface:#121a24; --surface-2:#1a2431; --surface-3:#0e151e;
  --text:#eaf1f8; --muted:#8a9bb0; --line:#223041;
  --accent:#5cc8ff; --accent-ink:#04121c; --accent-soft:rgba(92,200,255,.12);
  --win:#3ddc97; --loss:#ff6b6b; --tie:#f4c95d; --live:#ff3b3b;
  --header:#0d1520; --red-line:#e23a3a;
  --radius:16px; --shadow:0 6px 18px rgba(0,0,0,.35);
  --glow:0 0 0 1px var(--accent),0 8px 26px rgba(92,200,255,.18);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#e6ecf2; --surface-3:#f6f8fb;
  --text:#0d1722; --muted:#5a6b7e; --line:#d5dde6;
  --accent:#0077c2; --accent-ink:#ffffff; --accent-soft:#e1f1fb;
  --win:#16884f; --loss:#c42b2b; --tie:#9a7400; --live:#d92020;
  --shadow:0 1px 3px rgba(13,23,34,.08),0 4px 12px rgba(13,23,34,.05);
  --glow:0 0 0 1px var(--accent),0 6px 18px rgba(0,119,194,.15);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#e6ecf2; --surface-3:#f6f8fb;
    --text:#0d1722; --muted:#5a6b7e; --line:#d5dde6;
    --accent:#0077c2; --accent-ink:#ffffff; --accent-soft:#e1f1fb;
    --win:#16884f; --loss:#c42b2b; --tie:#9a7400; --live:#d92020;
    --shadow:0 1px 3px rgba(13,23,34,.08),0 4px 12px rgba(13,23,34,.05);
    --glow:0 0 0 1px var(--accent),0 6px 18px rgba(0,119,194,.15);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- header: dark with rink-line stripe ---------- */
.top{position:relative;background:var(--header);color:#fff;padding:18px 0 16px;padding-top:max(18px,env(safe-area-inset-top))}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#5cc8ff 0 30%,transparent 30% 32%,var(--red-line) 32% 68%,transparent 68% 70%,#5cc8ff 70%)}
.top .wrap{display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.top .sub{font-size:13px;color:#9fb3c8;margin-top:4px}
.top .grow{flex:1;min-width:0}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- controls ---------- */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.field select,.field input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;appearance:none;-webkit-appearance:none}
.field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field.full{grid-column:1/-1}
.field.team select{border-color:var(--accent);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:8px;z-index:5;margin-bottom:14px;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;cursor:pointer;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs .count{font-weight:600;opacity:.75;font-size:14px;margin-left:5px}

/* ---------- team summary (scoreboard strip) ---------- */
.summary{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.summary .rec{font-family:var(--display);font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.summary .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.summary .next{margin-left:auto;text-align:right;font-size:13px;min-width:0}
.summary .next b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.3px;margin:2px 0}

/* ---------- day groups ---------- */
.day{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:20px 2px 10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day:first-child{margin-top:4px}

/* ---------- scoreboard game cards ---------- */
.game{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.game.mine{border-color:var(--accent);box-shadow:var(--glow)}
.game.live{border-color:var(--live)}
.game.cancelled{opacity:.55}
.meta{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface-3);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.game.mine .meta{background:var(--accent-soft)}
.meta time{color:var(--text)}
.meta .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center}
.badge.final{color:var(--text)}
.badge.live{background:var(--live);color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.badge.cancel{background:transparent;border:1px solid var(--loss);color:var(--loss)}
.badge.res-W{background:var(--win);color:#04140c}.badge.res-L{background:var(--loss);color:#fff}.badge.res-T{background:var(--tie);color:#1c1500}

.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;padding:16px 12px 10px}
.tcol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.tcol img,.tcol .ph{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff;padding:4px;border:1px solid var(--line);flex:none}
.tcol .ph{display:grid;place-items:center;padding:0;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--muted)}
.tcol.me img,.tcol.me .ph{box-shadow:0 0 0 2px var(--accent)}
.tcol .nm{font-weight:600;font-size:14px;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tcol.me .nm{color:var(--accent);font-weight:700}
.tcol .ha{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

.board{display:flex;align-items:center;gap:6px;font-family:var(--display);padding:0 2px;align-self:start;margin-top:4px}
.board .sc{font-size:50px;font-weight:700;line-height:1;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
.board .sc.lose{color:var(--muted);opacity:.65}
.board .dash{font-size:30px;color:var(--muted)}
.board.is-live .sc{color:var(--live)}
.board.vs{flex-direction:column;gap:2px;margin-top:8px}
.board .clock{font-size:28px;font-weight:700;line-height:1;white-space:nowrap}
.board .vs-l{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

.venue{font-size:13px;color:var(--muted);padding:2px 14px 0;display:flex;gap:6px;align-items:flex-start;justify-content:center;text-align:center}
.venue a{color:var(--muted);text-decoration:none}
.venue a:hover{text-decoration:underline;color:var(--text)}
.venue svg{width:14px;height:14px;flex:none;margin-top:2px}
.actions{display:flex;gap:8px;padding:12px 14px 14px}
.actions .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:10px 12px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:not(.primary):hover{border-color:var(--muted)}

/* ---------- standings ---------- */
.sched-h{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:6px 2px 8px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;margin-bottom:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface-3)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.t,td.t{text-align:left;white-space:normal;min-width:150px}
td.rk{color:var(--muted);width:32px}
td.pts{font-weight:700;color:var(--accent)}
tr.me td{background:var(--accent-soft)}
tr.me td.t{font-weight:700;color:var(--accent)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}

/* ---------- misc ---------- */
.empty,.error{text-align:center;color:var(--muted);padding:40px 16px}
.error{color:var(--loss)}
.notice{font-size:13px;background:var(--surface-2);border-radius:12px;padding:8px 12px;margin-bottom:10px;color:var(--muted)}
.skel{height:170px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.more{display:flex;width:100%;margin:6px 0 14px;justify-content:center}
footer{font-size:12px;color:var(--muted);text-align:center;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
footer a{color:var(--muted)}
.themebtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
@media (min-width:640px){.controls{grid-template-columns:1fr 1fr 1fr 1.3fr}.field.full{grid-column:auto}.field.search{grid-column:1/-1}}
/* ---------- game page ---------- */
body.detail .controls,body.detail .tabs,body.detail #summary{display:none}
.match.tap{cursor:pointer}
.backbar{margin:16px 0 12px}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px 9px 8px;font-weight:600;cursor:pointer}
.back svg{width:18px;height:18px}
.back:hover{border-color:var(--muted)}
.hero .match{padding:24px 12px 8px}
.hero .tcol img,.hero .tcol .ph{width:72px;height:72px;border-radius:18px}
.hero .tcol .ph{font-size:24px}
.hero .tcol .nm{font-size:16px}
.hero .board .sc{font-size:68px}
.hero .board .clock{font-size:36px}
.hero .when{text-align:center;color:var(--muted);font-size:14px;padding:4px 14px 0}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.section h2{margin:0 0 10px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.venue-box .vn{font-weight:700;font-size:16px}
.venue-box .va{color:var(--muted);font-size:14px;margin-top:2px}
.actions.flush{padding:12px 0 0}
.rec2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recbox{background:var(--surface-2);border-radius:12px;padding:12px 8px;text-align:center;min-width:0}
.recbox.me{box-shadow:0 0 0 1px var(--accent) inset}
.recbox .tn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recbox.me .tn{color:var(--accent)}
.recbox .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.recbox .small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.form{display:flex;gap:4px;justify-content:center;margin-top:10px}
.form .badge{width:24px;justify-content:center;padding:3px 0;text-decoration:none}
.h2h a{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);text-decoration:none}
.h2h a:first-of-type{border-top:0;padding-top:2px}
.h2h a:hover .m{color:var(--accent)}
.h2h .d{color:var(--muted);font-size:13px;width:88px;flex:none}
.h2h .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.h2h .s{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.badge.live::before,.skel,.spin svg{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg width="38" height="38" viewBox="0 0 34 34" aria-hidden="true"><ellipse cx="17" cy="20" rx="13" ry="6" fill="#1c2836"/><rect x="4" y="16" width="26" height="4" fill="#1c2836"/><ellipse cx="17" cy="16" rx="13" ry="6" fill="#2a3a4d"/><ellipse cx="17" cy="16" rx="13" ry="6" fill="none" stroke="#5cc8ff" stroke-width="1.5"/><ellipse cx="17" cy="16" rx="6" ry="2.6" fill="none" stroke="#5cc8ff" stroke-width="1" opacity=".5"/></svg>
    <div class="grow">
      <h1>Game Sheets</h1>
      <div class="sub" id="sub">PCAHA A</div>
    </div>
    <button class="iconbtn" id="refresh" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <div class="field"><label for="league">League</label><select id="league"></select></div>
    <div class="field"><label for="cat">Division</label><select id="cat"></select></div>
    <div class="field"><label for="sch">Schedule</label><select id="sch"></select></div>
    <div class="field team"><label for="team">My team</label><select id="team"><option value="">All teams</option></select></div>
    <div class="field full search"><label for="q">Search</label><input id="q" type="search" placeholder="Team, arena or game #" autocomplete="off"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="results" aria-selected="true">Results<span class="count" id="c-results"></span></button>
    <button role="tab" data-tab="upcoming" aria-selected="false">Upcoming<span class="count" id="c-upcoming"></span></button>
    <button role="tab" data-tab="standings" aria-selected="false">Standings</button>
  </div>

  <div id="summary"></div>
  <div id="notice"></div>
  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<footer>
  <div id="updated"></div>
  <div style="margin-top:6px">Data from the public <a id="src" href="https://page.spordle.com/pcaha-a" target="_blank" rel="noopener">PCAHA A</a> Spordle page · Game sheets from <a href="https://pdf.hisports.app" target="_blank" rel="noopener">hisports</a> · <button class="themebtn" id="theme">Theme: dark</button></div>
</footer>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
const API = 'https://pub-api.play.spordle.com/api/sp';
// Public, read-only key published by page.spordle.com itself.
const API_KEY = 'f08ed9064e3cdc382e6abb305ff543d0150fb52f';
// Each league is a Spordle "office". To add another league, add an entry here.
//  - officeId: Spordle office id, if known.
//  - probeScheduleId / nameLike: used to look the office id up automatically when it isn't known.
const LEAGUES = [
  { key: 'pcaha', name: 'PCAHA A', short: 'pcaha-a', officeId: 786,
    defaultCategory: '599ab4b2-6f05-48eb-99bd-9f6b80810e12' /* U13 A */ },
  { key: 'pcehl', name: 'PCEHL', short: 'pacific-coast-elite-hockey-league', officeId: 8585,
    nameLike: ['%PACIFIC COAST ELITE%', '%Pacific Coast Elite%', '%PCEHL%'], nameMatch: /pacific coast elite|pcehl/i,
    defaultCategoryMatch: /U13/i },
];
const SHEET_URL = id => `https://pdf.hisports.app/game/${id}`;
const GAME_URL  = id => `https://page.spordle.com/${L().short}/schedule/${id}`;
const PAGE_SIZE = 40;

/* ---------- storage (best-effort) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pcaha:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pcaha:' + k, JSON.stringify(v)); } catch {} }
};
// Per-league preferences (PCAHA falls back to the keys used before leagues existed).
const pref = {
  get(k, d) { const v = store.get(S.league + ':' + k, undefined); return v !== undefined ? v : (S.league === 'pcaha' ? store.get(k, d) : d); },
  set(k, v) { store.set(S.league + ':' + k, v); }
};

/* ---------- state ---------- */
const S = {
  league: LEAGUES.some(l => l.key === store.get('league', 'pcaha')) ? store.get('league', 'pcaha') : 'pcaha',
  officeId: null, season: null, categories: [], schedules: [],
  categoryId: null, scheduleId: 'all', teamId: '',
  tab: store.get('tab', 'results'),
  q: '',
  games: [], standings: {}, loadedAt: null, offline: false,
  shown: PAGE_SIZE,
};

const L = () => LEAGUES.find(l => l.key === S.league);
function loadPrefs() {
  S.categoryId = pref.get('categoryId', L().defaultCategory || null);
  S.scheduleId = pref.get('scheduleId', 'all');
  S.teamId = pref.get('teamId', '');
}
loadPrefs();

const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

/* ---------- api ---------- */
async function api(path, filter) {
  let url = API + path;
  if (filter) url += (path.includes('?') ? '&' : '?') + 'filter=' + encodeURIComponent(JSON.stringify(filter));
  const r = await fetch(url, { headers: { Authorization: 'API-Key ' + API_KEY } });
  if (!r.ok) throw new Error(`Spordle API returned ${r.status}`);
  return r.json();
}

/* ---------- time helpers ---------- */
const TZ = 'America/Vancouver';
const fmt = (d, o) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, ...o }).format(d);
const dayKey = d => fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' });
function dayLabel(d) {
  const now = new Date(), k = dayKey(d);
  if (k === dayKey(now)) return 'Today';
  if (k === dayKey(new Date(now.getTime() + 864e5))) return 'Tomorrow';
  if (k === dayKey(new Date(now.getTime() - 864e5))) return 'Yesterday';
  return fmt(d, { weekday: 'long', month: 'long', day: 'numeric' });
}
const timeStr = d => fmt(d, { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?m\.?/i, (_, a) => ' ' + a.toUpperCase() + 'M');
const shortDate = d => fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });

/* ---------- game model ---------- */
function status(g) {
  const now = Date.now(), st = new Date(g.startTime).getTime(), en = new Date(g.endTime || g.startTime).getTime();
  if (g.status && g.status !== 'Active') return 'cancelled';
  if (g.isLive) return 'live';
  if (st > now) return 'upcoming';
  if (g.score && Object.keys(g.score).length) return 'final';
  if (en > now) return 'live';
  return 'pending';
}
const scoreOf = (g, teamId) => g.score && g.score[teamId] != null ? g.score[teamId] : null;
const teamName = t => t ? (t.shortName || t.name) : 'TBA';
function resultFor(g, teamId) {
  const me = scoreOf(g, teamId), opp = scoreOf(g, teamId === g.homeTeamId ? g.awayTeamId : g.homeTeamId);
  if (me == null || opp == null) return null;
  return me > opp ? 'W' : me < opp ? 'L' : 'T';
}

/* ---------- loading ---------- */
// Find the league's Spordle office id (cached after the first successful lookup).
async function resolveOffice(lg) {
  if (lg.officeId) return lg.officeId;
  const cached = store.get('office:' + lg.key, null);
  if (cached) return cached;
  const attempts = [];
  if (lg.probeScheduleId) attempts.push(async () => (await api(`/schedules/${lg.probeScheduleId}`)).officeId);
  for (const pat of lg.nameLike || []) attempts.push(async () => {
    const rows = await api('/offices', { where: { name: { like: pat } } });
    const named = lg.nameMatch ? rows.filter(o => lg.nameMatch.test(o.name || '')) : rows;
    const leagueRow = named.find(o => /league/i.test(o.type || '')) || named[0];
    return leagueRow && leagueRow.id;
  });
  for (const a of attempts) {
    try { const id = await a(); if (id) { store.set('office:' + lg.key, id); return id; } } catch {}
  }
  throw new Error(`Couldn’t find the ${lg.name} league on Spordle`);
}

async function boot() {
  applyTheme(store.get('theme', 'dark'));
  fillLeagues();
  S.games = []; S.standings = {}; S.categories = []; S.schedules = [];
  setBusy(true);
  try {
    const lg = L();
    S.officeId = await resolveOffice(lg);
    const seasons = await api(`/seasons?officeId=${S.officeId}`);
    S.season = (seasons.find(s => s.isCurrent) || seasons[0]).seasonId;
    const [cats, scheds] = await Promise.all([
      api(`/categories?officeId=${S.officeId}&seasonId=${S.season}`),
      api(`/schedules?officeId=${S.officeId}&seasonId=${S.season}`)
    ]);
    S.categories = cats.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true }));
    S.schedules = scheds.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
    if (!S.categories.some(c => c.id === S.categoryId)) {
      const pick = S.categories.find(c => c.id === lg.defaultCategory)
        || (lg.defaultCategoryMatch && S.categories.find(c => lg.defaultCategoryMatch.test(c.name)))
        || S.categories[0];
      S.categoryId = pick ? pick.id : null;
    }
    fillSelectors();
    await loadGames();
  } catch (e) {
    setBusy(false);
    if (!restoreCache()) showError(e);
  }
}

function schedulesForCategory() { return S.schedules.filter(s => s.categoryId === S.categoryId); }

async function loadGames() {
  setBusy(true);
  const scheds = schedulesForCategory();
  const ids = S.scheduleId === 'all' ? scheds.map(s => s.id) : [Number(S.scheduleId)];
  if (!ids.length) { S.games = []; S.standings = {}; setBusy(false); render(); return; }
  try {
    const [games, ...stand] = await Promise.all([
      api('/games', { where: { scheduleId: { inq: ids } }, include: ['homeTeam', 'awayTeam', 'surface'], order: ['startTime ASC', 'number ASC'] }),
      ...ids.map(id => api(`/schedules/${id}/teamStats`, { where: { team: { name: { neq: 'TBA' } } }, include: ['team'] }).catch(() => []))
    ]);
    S.games = games;
    S.standings = Object.fromEntries(ids.map((id, i) => [id, stand[i]]));
    S.loadedAt = new Date(); S.offline = false;
    store.set('cache', { key: cacheKey(), games: S.games, standings: S.standings, at: S.loadedAt.toISOString(), schedules: S.schedules, categories: S.categories, season: S.season });
  } catch (e) {
    if (!restoreCache()) { setBusy(false); showError(e); return; }
  }
  setBusy(false);
  fillTeams();
  render();
}

const cacheKey = () => S.league + '|' + S.categoryId + '|' + S.scheduleId;
function restoreCache() {
  const c = store.get('cache', null);
  if (!c || (c.key !== cacheKey() && !(S.categoryId == null && c.key.startsWith(S.league + '|')))) return false;
  const [, cat, sch] = c.key.split('|');
  Object.assign(S, { categoryId: cat, scheduleId: sch, games: c.games, standings: c.standings, loadedAt: new Date(c.at), offline: true });
  if (!S.schedules.length) { S.schedules = c.schedules || []; S.categories = c.categories || []; S.season = c.season; fillSelectors(); }
  fillTeams(); render();
  return true;
}

/* ---------- selectors ---------- */
function fillLeagues() {
  const sel = $('#league');
  sel.replaceChildren(...LEAGUES.map(l => el('option', { value: l.key }, l.name)));
  sel.value = S.league;
  $('#src').textContent = L().name;

}
function fillSelectors() {
  const cat = $('#cat'); cat.replaceChildren(...S.categories.map(c => el('option', { value: c.id }, c.name)));
  if (S.categoryId) cat.value = S.categoryId;
  fillSchedules();

}
function fillSchedules() {
  const scheds = schedulesForCategory();
  const sel = $('#sch');
  sel.replaceChildren(el('option', { value: 'all' }, scheds.length > 1 ? `All schedules (${scheds.length})` : 'All schedules'),
    ...scheds.map(s => el('option', { value: String(s.id) }, s.name)));

}
function fillTeams() {
  const map = new Map();
  for (const g of S.games) for (const t of [g.homeTeam, g.awayTeam]) if (t && !/^tba$/i.test(t.name)) map.set(t.id, t);
  for (const rows of Object.values(S.standings)) for (const r of rows || []) if (r.team) map.set(r.team.id, r.team);
  const teams = [...map.values()].sort((a, b) => teamName(a).localeCompare(teamName(b), 'en', { numeric: true }));
  const sel = $('#team');
  sel.replaceChildren(el('option', { value: '' }, 'All teams'), ...teams.map(t => el('option', { value: String(t.id), title: t.name }, teamName(t))));
  if (S.teamId && !map.has(Number(S.teamId))) { /* keep preference; team may belong to another division */ sel.value = ''; }
  else sel.value = String(S.teamId || '');
}

/* ---------- filtering ---------- */
function filtered() {
  const tid = Number($('#team').value) || null;
  const q = S.q.trim().toLowerCase();
  return S.games.filter(g => {
    if (tid && g.homeTeamId !== tid && g.awayTeamId !== tid) return false;
    if (!q) return true;
    const v = g.surface && g.surface.venue;
    return [g.number, g.id, g.homeTeam && g.homeTeam.name, g.homeTeam && g.homeTeam.shortName, g.awayTeam && g.awayTeam.name,
      g.awayTeam && g.awayTeam.shortName, v && v.name, v && v.city].some(x => x != null && String(x).toLowerCase().includes(q));
  });
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  // A "#game/<id>" address shows this app's own game page instead of the lists.
  const gid = gameFromHash();
  document.body.classList.toggle('detail', !!gid);
  $('#updated').textContent = S.loadedAt ? `Updated ${shortDate(S.loadedAt)}, ${timeStr(S.loadedAt)}` : '';
  if (gid) return renderDetail(gid);
  document.title = BASE_TITLE;
  const games = filtered();
  const upcoming = games.filter(g => { const s = status(g); return s === 'upcoming' || s === 'live' || (s === 'cancelled' && new Date(g.startTime) > new Date()); });
  const now = new Date();
  const results = games.filter(g => new Date(g.startTime) <= now).reverse();
  $('#c-upcoming').textContent = upcoming.length ? upcoming.length : '';
  $('#c-results').textContent = results.length ? results.length : '';

  renderSummary(games, upcoming);
  $('#notice').replaceChildren(S.offline ? el('div', { class: 'notice' }, `Offline — showing saved data from ${shortDate(S.loadedAt)} ${timeStr(S.loadedAt)}.`) : '');
  $('#updated').textContent = S.loadedAt ? `Updated ${shortDate(S.loadedAt)}, ${timeStr(S.loadedAt)}` : '';

  const list = $('#list');
  if (S.tab === 'standings') return list.replaceChildren(renderStandings());
  const src = S.tab === 'upcoming' ? upcoming : results;
  if (!src.length) return list.replaceChildren(el('div', { class: 'empty' },
    S.tab === 'upcoming' ? 'No upcoming games scheduled yet.' : 'No games played yet.'));
  const out = []; let lastDay = null;
  for (const g of src.slice(0, S.shown)) {
    const d = new Date(g.startTime), k = dayKey(d);
    if (k !== lastDay) { out.push(el('div', { class: 'day' }, dayLabel(d))); lastDay = k; }
    out.push(gameCard(g));
  }
  if (src.length > S.shown) out.push(el('button', { class: 'btn more', onclick: () => { S.shown += PAGE_SIZE; render(); } }, `Show more (${src.length - S.shown} left)`));
  list.replaceChildren(...out);
}

function renderSummary(games, upcoming) {
  const tid = Number($('#team').value) || null;
  const box = $('#summary');
  if (!tid) return box.replaceChildren();
  // Prefer the league's official standings record (it excludes games that don't count);
  // fall back to tallying final scores ourselves.
  let w = 0, l = 0, t = 0, pts = null;
  const rows = Object.values(S.standings).flat().filter(r => r && r.teamId === tid);
  if (rows.length) { for (const r of rows) { w += r.wins || 0; l += r.losses || 0; t += r.ties || 0; pts = (pts || 0) + (r.points || 0); } }
  else for (const g of games) { const r = status(g) === 'final' ? resultFor(g, tid) : null; if (r === 'W') w++; else if (r === 'L') l++; else if (r === 'T') t++; }
  const next = upcoming.find(g => status(g) === 'upcoming');
  const live = upcoming.find(g => status(g) === 'live');
  const n = live || next;
  const opp = n ? (n.homeTeamId === tid ? n.awayTeam : n.homeTeam) : null;
  box.replaceChildren(el('div', { class: 'summary' },
    el('div', {}, el('div', { class: 'rec' }, `${w}-${l}-${t}`), el('div', { class: 'lbl' }, pts != null ? `W-L-T · ${pts} pts` : 'W-L-T')),
    n ? el('div', { class: 'next' }, el('span', { class: 'lbl' }, live ? 'Playing now' : 'Next game'),
      el('b', {}, `${n.homeTeamId === tid ? 'vs' : '@'} ${teamName(opp)}`),
      el('span', {}, `${shortDate(new Date(n.startTime))} · ${timeStr(new Date(n.startTime))}`)) : ''));
}

// Season record for a team: league standings when available, otherwise tallied from final scores.
function recordFor(teamId) {
  const rows = Object.values(S.standings).flat().filter(r => r && r.teamId === teamId);
  if (rows.length) return rows.reduce((a, r) => ({ w: a.w + (r.wins || 0), l: a.l + (r.losses || 0), t: a.t + (r.ties || 0),
    pts: a.pts + (r.points || 0), gf: a.gf + (r.goalFor || 0), ga: a.ga + (r.goalAgainst || 0) }), { w: 0, l: 0, t: 0, pts: 0, gf: 0, ga: 0 });
  const rec = { w: 0, l: 0, t: 0, pts: null, gf: 0, ga: 0 };
  let any = false;
  for (const g of S.games) {
    if (status(g) !== 'final' || (g.homeTeamId !== teamId && g.awayTeamId !== teamId)) continue;
    const r = resultFor(g, teamId); if (!r) continue;
    any = true; rec[r.toLowerCase()]++;
    rec.gf += scoreOf(g, teamId); rec.ga += scoreOf(g, teamId === g.homeTeamId ? g.awayTeamId : g.homeTeamId);
  }
  return any ? rec : null;
}

// Last five results for a team, oldest first.
function formFor(teamId) {
  return S.games.filter(g => status(g) === 'final' && (g.homeTeamId === teamId || g.awayTeamId === teamId) && resultFor(g, teamId))
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime)).slice(-5)

}

// Calendar file so a parent can add the game to their phone.
function downloadIcs(g) {
  const stamp = x => new Date(x).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const esc = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const end = g.endTime || new Date(new Date(g.startTime).getTime() + 75 * 60e3).toISOString();
  const v = g.surface && g.surface.venue;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hockey Game Sheets//EN', 'BEGIN:VEVENT',
    `UID:game-${g.id}@hockey-game-sheets`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(g.startTime)}`, `DTEND:${stamp(end)}`,
    `SUMMARY:${esc(`${teamName(g.awayTeam)} @ ${teamName(g.homeTeam)}`)}`,
    v ? `LOCATION:${esc([v.name, v.address, v.city].filter(Boolean).join(', '))}` : '',
    `DESCRIPTION:${esc(`Game #${g.number}\n${location.href}`)}`, 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  const a = el('a', { href: url, download: `game-${g.number}.ics` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

}

function renderDetail(id) {
  const list = $('#list');
  const back = el('div', { class: 'backbar' }, el('button', { class: 'back', html: ICON_BACK + '<span>Back</span>', onclick: backToList }));
  let g = S.games.find(x => x.id === id) || (S.extraGame && S.extraGame.id === id ? S.extraGame : null);
  if (!g) {
    // Opened from a shared link for a game outside the loaded division: fetch just that game.
    list.replaceChildren(back, el('div', { class: 'skel' }));
    if (S.fetching !== id) {
      S.fetching = id;
      api('/games', { where: { id }, include: ['homeTeam', 'awayTeam', 'surface'] })
        .then(r => { S.extraGame = r[0] || { id, missing: true }; })
        .catch(() => { S.extraGame = { id, missing: true }; })
        .finally(() => { S.fetching = null; if (gameFromHash() === id) render(); });
    }
    return;
  }
  if (g.missing) return list.replaceChildren(back, el('div', { class: 'empty' }, 'Couldn’t find that game.'));

  const st = status(g), d = new Date(g.startTime);
  const tid = Number($('#team').value) || null;
  const mine = tid && (g.homeTeamId === tid || g.awayTeamId === tid);
  const res = mine && st === 'final' ? resultFor(g, tid) : null;
  const v = g.surface && g.surface.venue, sn = g.surface && g.surface.name;
  const rink = !sn || !v || sn === v.name ? '' : /^\d+$/.test(sn) ? `Rink ${sn}` : sn;
  const mapQ = v ? encodeURIComponent([v.name, v.address, v.city].filter(Boolean).join(', ')) : '';
  const sheetReady = st === 'final' || st === 'live' || st === 'pending';
  document.title = `${teamName(g.awayTeam)} @ ${teamName(g.homeTeam)} · ${BASE_TITLE}`;

  const hero = el('article', { class: 'game hero' + (mine ? ' mine' : '') + (st === 'cancelled' ? ' cancelled' : '') + (st === 'live' ? ' live' : '') },
    el('div', { class: 'meta' }, el('span', {}, 'Game #' + g.number),
      el('span', { class: 'right' }, res ? el('span', { class: 'badge res-' + res }, res) : '', statusBadge(g, st))),
    el('div', { class: 'match' }, teamCol(g, g.awayTeam, 'away', tid), scoreboard(g, st, d), teamCol(g, g.homeTeam, 'home', tid)),
    el('div', { class: 'when' }, `${fmt(d, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })} · ${timeStr(d)}`),
    el('div', { class: 'actions' },
      sheetReady ? el('a', { class: 'btn primary', href: SHEET_URL(g.id), target: '_blank', rel: 'noopener', html: ICON_SHEET + '<span>Game sheet</span>' }) : '',
      st === 'upcoming' ? el('button', { class: 'btn primary', html: ICON_CAL + '<span>Add to calendar</span>', onclick: () => downloadIcs(g) }) : '',
      el('button', { class: 'btn', html: ICON_SHARE + '<span>Share</span>', onclick: e => shareGame(g, e.currentTarget) })));

  const sections = [hero];

  if (v) sections.push(el('section', { class: 'section venue-box' }, el('h2', {}, 'Rink'),
    el('div', { class: 'vn' }, v.name), el('div', { class: 'va' }, [rink, v.address, v.city].filter(Boolean).join(' · ')),
    el('div', { class: 'actions flush' },
      el('a', { class: 'btn', href: `https://www.google.com/maps/search/?api=1&query=${mapQ}`, target: '_blank', rel: 'noopener', html: ICON_PIN + '<span>Map</span>' }),
      el('a', { class: 'btn', href: `https://www.google.com/maps/dir/?api=1&destination=${mapQ}`, target: '_blank', rel: 'noopener', html: ICON_EXT + '<span>Directions</span>' }))));

  const recBox = (team, teamId, side) => {
    const r = recordFor(teamId), form = formFor(teamId);
    return el('div', { class: 'recbox' + (teamId === tid ? ' me' : '') },
      el('div', { class: 'tn', title: team ? team.name : '' }, teamName(team)),
      el('div', { class: 'small' }, side),
      el('div', { class: 'big' }, r ? `${r.w}-${r.l}-${r.t}` : '—'),
      el('div', { class: 'small' }, r ? [r.pts != null ? `${r.pts} pts` : '', `GF ${r.gf} · GA ${r.ga}`].filter(Boolean).join(' · ') : 'No games yet'),
      form.length ? el('div', { class: 'form', title: 'Last 5 games' }, form) : '');
  };
  if (g.homeTeam && g.awayTeam) sections.push(el('section', { class: 'section' }, el('h2', {}, 'Season so far'),
    el('div', { class: 'rec2' }, recBox(g.awayTeam, g.awayTeamId, 'away'), recBox(g.homeTeam, g.homeTeamId, 'home'))));

  // Every other meeting between these two teams this season.
  const h2h = S.games.filter(x => x.id !== g.id &&
    ((x.homeTeamId === g.homeTeamId && x.awayTeamId === g.awayTeamId) || (x.homeTeamId === g.awayTeamId && x.awayTeamId === g.homeTeamId)))
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
  if (h2h.length) sections.push(el('section', { class: 'section h2h' }, el('h2', {}, 'Head to head'),
    ...h2h.map(x => {
      const xs = status(x), a = scoreOf(x, x.awayTeamId), h = scoreOf(x, x.homeTeamId);
      return el('a', { href: '#game/' + x.id },
        el('span', { class: 'd' }, shortDate(new Date(x.startTime))),
        el('span', { class: 'm' }, `${teamName(x.awayTeam)} @ ${teamName(x.homeTeam)}`),
        el('span', { class: 's' }, (xs === 'final' || xs === 'live') && a != null && h != null ? `${a}–${h}` : timeStr(new Date(x.startTime))));
    })));

  list.replaceChildren(back, ...sections);
}

// Moving between the lists and a game page keeps your place in the list.
let lastGid = gameFromHash();
function onRoute() {
  const gid = gameFromHash();
  if (gid && !lastGid) { S.listScroll = window.scrollY; S.cameFromList = true; }
  if (!gid) S.cameFromList = false;
  render();
  window.scrollTo(0, gid ? 0 : (S.listScroll || 0));
  lastGid = gid;
}
window.addEventListener('hashchange', onRoute);

/* ---------- ui plumbing ---------- */
function setBusy(b) { $('#refresh').classList.toggle('spin', b); if (b && !S.games.length) $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; }
function showError(e) {
  $('#list').replaceChildren(el('div', { class: 'error' }, 'Couldn’t load games from Spordle. ', el('br'), el('small', {}, String(e.message || e)),
    el('div', { style: 'margin-top:12px' }, el('button', { class: 'btn', onclick: () => (S.schedules.length ? loadGames() : boot()) }, 'Try again'))));
}
function onTeam() { S.teamId = $('#team').value; pref.set('teamId', S.teamId); S.shown = PAGE_SIZE; }

$('#league').addEventListener('change', e => {
  S.league = e.target.value; store.set('league', S.league); loadPrefs();
  S.shown = PAGE_SIZE; $('#team').replaceChildren(el('option', { value: '' }, 'All teams'));
  boot();
});
$('#cat').addEventListener('change', e => { S.categoryId = e.target.value; pref.set('categoryId', S.categoryId); S.scheduleId = 'all'; pref.set('scheduleId', 'all'); fillSelectors(); S.games = []; loadGames(); });
$('#sch').addEventListener('change', e => { S.scheduleId = e.target.value; pref.set('scheduleId', S.scheduleId); loadGames(); });
$('#team').addEventListener('change', () => { onTeam(); render(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; S.shown = PAGE_SIZE; render(); });
$('#refresh').addEventListener('click', () => (S.schedules.length ? loadGames() : boot()));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; store.set('tab', S.tab); S.shown = PAGE_SIZE; render(); }));

// Dark is the default; tap the footer link to cycle dark → light → auto (follows the phone's setting).
const THEMES = ['dark', 'light', 'auto'];
function applyTheme(t) {
  if (!THEMES.includes(t)) t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = 'Theme: ' + t;
}
$('#theme').addEventListener('click', () => { const t = THEMES[(THEMES.indexOf(store.get('theme', 'dark')) + 1) % THEMES.length]; store.set('theme', t); applyTheme(t); });

// refresh when returning to the tab after a while (e.g. between periods)
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt > 5 * 60e3) loadGames(); });

boot();
})();
</script>
</body>
